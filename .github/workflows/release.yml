name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.7.5"
        required: true
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      # Prevent Java-version-specific Gradle caches from being reused
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Resolve version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          VERSION="${TAG#v}"

          test -n "$VERSION"

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------
      # Forge 1.20.1
      # ------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Build Forge 1.20.1
        run: cd forge-1.20.1 && ./gradlew build -Pmod_version="${VERSION}"


      # ------------------------------
      # NeoForge 1.21.1, 1.21.8
      # ------------------------------


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Build NeoForge 1.21.1
        run: cd neoforge-1.21.1 && ./gradlew build -Pmod_version="${VERSION}"

      - name: Build NeoForge 1.21.8
        run: cd neoforge-1.21.8 && ./gradlew build -Pmod_version="${VERSION}"


      # ------------------------------
      # NeoForge 26.2
      # ------------------------------

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build NeoForge 26.2
        run: cd neoforge-26.2 && ./gradlew build -Pmod_version="${VERSION}"

      # ------------------------------
      # Verify common classes are bundled
      # ------------------------------

      - name: Verify Forge JAR
        shell: bash
        run: |
          set -euo pipefail

          FORGE_JAR=$(find forge-1.20.1/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          test -n "$FORGE_JAR"

          echo "Forge JAR: $FORGE_JAR"

          jar tf "$FORGE_JAR" \
            | grep "com/example/vitalrelics/common/relics/Loader.class"

      - name: Verify NeoForge 1.21.1 JAR
        shell: bash
        run: |
          set -euo pipefail

          NEOFORGE_JAR=$(find neoforge-1.21.1/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          test -n "$NEOFORGE_JAR"

          echo "NeoForge 1.21.1 JAR: $NEOFORGE_JAR"

          jar tf "$NEOFORGE_JAR" \
            | grep "com/example/vitalrelics/common/relics/Loader.class"

      - name: Verify NeoForge 1.21.8 JAR
        shell: bash
        run: |
          set -euo pipefail

          NEOFORGE_JAR=$(find neoforge-1.21.8/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          test -n "$NEOFORGE_JAR"

          echo "NeoForge 1.21.8 JAR: $NEOFORGE_JAR"

          jar tf "$NEOFORGE_JAR" \
            | grep "com/example/vitalrelics/common/relics/Loader.class"

      - name: Verify NeoForge 26.2 JAR
        shell: bash
        run: |
          set -euo pipefail

          NEOFORGE_JAR=$(find neoforge-26.2/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          test -n "$NEOFORGE_JAR"

          echo "NeoForge 26.2 JAR: $NEOFORGE_JAR"

          jar tf "$NEOFORGE_JAR" \
            | grep "com/example/vitalrelics/common/relics/Loader.class"

      # ------------------------------
      # Prepare release artifacts
      # ------------------------------

      - name: Prepare release JARs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          FORGE_JAR=$(find forge-1.20.1/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          NEOFORGE_1211_JAR=$(find neoforge-1.21.1/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          NEOFORGE_1218_JAR=$(find neoforge-1.21.8/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          NEOFORGE_262_JAR=$(find neoforge-26.2/build/libs \
            -maxdepth 1 -type f -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            | head -n 1)

          test -n "$FORGE_JAR"
          test -n "$NEOFORGE_1211_JAR"
          test -n "$NEOFORGE_1218_JAR"
          test -n "$NEOFORGE_262_JAR"

          cp "$FORGE_JAR" \
            "release/vitalrelics-forge-1.20.1-${VERSION}.jar"

          cp "$NEOFORGE_1211_JAR" \
            "release/vitalrelics-neoforge-1.21.1-${VERSION}.jar"

          cp "$NEOFORGE_1218_JAR" \
            "release/vitalrelics-neoforge-1.21.8-${VERSION}.jar"

          cp "$NEOFORGE_262_JAR" \
            "release/vitalrelics-neoforge-26.2-${VERSION}.jar"

      # ------------------------------
      # Diagnostics
      # ------------------------------

      - name: Show release JARs
        run: |
          echo "Release artifacts:"
          ls -lh release/

      # ------------------------------
      # GitHub Release
      # ------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/vitalrelics-forge-1.20.1-${{ env.VERSION }}.jar
            release/vitalrelics-neoforge-1.21.1-${{ env.VERSION }}.jar
            release/vitalrelics-neoforge-1.21.8-${{ env.VERSION }}.jar
            release/vitalrelics-neoforge-26.2-${{ env.VERSION }}.jar

      # ------------------------------
      # Forge / NeoForge update checker
      # ------------------------------

      - name: Update version checker
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("update.json")
          version = os.environ["VERSION"]
          data = json.loads(path.read_text())

          for minecraft in ("1.20.1", "1.21.1", "1.21.8", "26.2"):
              data.setdefault(minecraft, {})[version] = f"Vital Relics v{version}"
              data.setdefault("promos", {})[f"{minecraft}-latest"] = version
              data["promos"][f"{minecraft}-recommended"] = version

          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json

          if ! git diff --cached --quiet; then
            git commit -m "Update version checker for ${TAG}"
            git push origin main
          fi
